/* =====================================================
   VARIABLES
===================================================== */

let questions = [];
let currentQuestion = 0;
let score = 0;
let selectedAnswer = null;

let timerInterval;
let remainingSeconds;


/* =====================================================
   SHUFFLE
===================================================== */

function shuffle(array) {

    let arr = [...array];

    for(let i = arr.length - 1; i > 0; i--) {

        const j =
            Math.floor(Math.random() * (i + 1));

        [arr[i], arr[j]] =
        [arr[j], arr[i]];
    }

    return arr;
}


/* =====================================================
   DURATION
===================================================== */

function secondsPerQuestion(level) {

    if(level === "basic")
        return 25;

    if(level === "intermediate")
        return 40;

    if(level === "advanced")
        return 60;

    if(level === "expert")
        return 90;

    return 40;
}


function formatTime(seconds) {

    const min =
        Math.floor(seconds / 60);

    const sec =
        seconds % 60;

    return String(min).padStart(2,"0")
        + ":" +
        String(sec).padStart(2,"0");
}


function updateDurationPreview() {

    const level =
        document.getElementById("level").value;

    let count =
        parseInt(
            document.getElementById("questionCount").value
        ) || 1;

    const seconds =
        count * secondsPerQuestion(level);

    document.getElementById("durationPreview").value =
        formatTime(seconds);
}


document
.getElementById("level")
.addEventListener(
    "change",
    updateDurationPreview
);

document
.getElementById("questionCount")
.addEventListener(
    "input",
    updateDurationPreview
);

updateDurationPreview();


/* =====================================================
   START TEST
===================================================== */

function startTest() {

    const level =
        document.getElementById("level").value;

    let count =
        parseInt(
            document.getElementById("questionCount").value
        );

    if(count < 5)
        count = 5;

    const bank =
        questionBank[level];

    /*
       If requested number is larger than the
       available bank, recycle randomized questions.
    */

    questions = [];

    while(questions.length < count) {

        questions =
            questions.concat(
                shuffle(bank)
            );
    }

    questions =
        questions.slice(0, count);


    currentQuestion = 0;
    score = 0;
    selectedAnswer = null;


    remainingSeconds =
        count * secondsPerQuestion(level);


    document
        .getElementById("setup")
        .classList.add("hidden");

    document
        .getElementById("quiz")
        .classList.remove("hidden");


    showQuestion();
    startTimer();
}


/* =====================================================
   SHOW QUESTION
===================================================== */

function showQuestion() {

    selectedAnswer = null;

    const q =
        questions[currentQuestion];


    document
        .getElementById("questionNumber")
        .textContent =
        "Question " +
        (currentQuestion + 1);


    document
        .getElementById("progressText")
        .textContent =
        `Question ${currentQuestion + 1} / ${questions.length}`;


    document
        .getElementById("scoreText")
        .textContent =
        `Score: ${score}`;


    document
        .getElementById("question")
        .textContent =
        q.q;


    const options =
        document.getElementById("options");

    options.innerHTML = "";


    q.o.forEach((option, index) => {

        const div =
            document.createElement("div");

        div.className = "option";

        div.textContent =
            String.fromCharCode(65 + index)
            + ". "
            + option;


        div.onclick = function() {

            selectAnswer(index, div);

        };


        options.appendChild(div);

    });


    document
        .getElementById("nextButton")
        .textContent =
        currentQuestion === questions.length - 1
        ? "Finish Test"
        : "Next Question";


    const percent =
        (currentQuestion / questions.length) * 100;

    document
        .getElementById("progressBar")
        .style.width =
        percent + "%";
}


/* =====================================================
   SELECT ANSWER
===================================================== */

function selectAnswer(index, element) {

    selectedAnswer = index;

    document
        .querySelectorAll(".option")
        .forEach(el => {
            el.classList.remove("selected");
        });

    element.classList.add("selected");
}


/* =====================================================
   NEXT QUESTION
===================================================== */

function nextQuestion() {

    if(selectedAnswer === null) {

        alert("Please select an answer.");

        return;
    }


    if(
        selectedAnswer ===
        questions[currentQuestion].a
    ) {

        score++;

    }


    currentQuestion++;


    if(currentQuestion >= questions.length) {

        finishTest();

    } else {

        showQuestion();

    }
}


/* =====================================================
   TIMER
===================================================== */

function startTimer() {

    clearInterval(timerInterval);

    updateTimer();


    timerInterval =
        setInterval(() => {

            remainingSeconds--;

            updateTimer();


            if(remainingSeconds <= 0) {

                clearInterval(timerInterval);

                finishTest();

            }

        }, 1000);
}


function updateTimer() {

    const timer =
        document.getElementById("timer");

    timer.textContent =
        formatTime(remainingSeconds);


    if(remainingSeconds <= 30) {

        timer.style.fontWeight = "bold";

    }
}


/* =====================================================
   FINISH
===================================================== */

function finishTest() {

    clearInterval(timerInterval);


    document
        .getElementById("quiz")
        .classList.add("hidden");


    document
        .getElementById("result")
        .classList.remove("hidden");


    const percentage =
        Math.round(
            (score / questions.length) * 100
        );


    document
        .getElementById("finalScore")
        .textContent =
        percentage + "%";


    let grade;


    if(percentage >= 90)
        grade = "Excellent 🏆";

    else if(percentage >= 80)
        grade = "Very Good 🎯";

    else if(percentage >= 70)
        grade = "Good 👍";

    else if(percentage >= 60)
        grade = "Keep Practicing 📚";

    else
        grade = "Needs Improvement 💪";


    document
        .getElementById("grade")
        .textContent =
        grade;


    document
        .getElementById("summary")
        .textContent =
        `You answered ${score} out of ${questions.length} questions correctly.`;
}


/* =====================================================
   ANTI-COPY PROTECTION
===================================================== */

/*
   Important:
   Browser JavaScript cannot completely prevent
   screenshots. These controls only make ordinary
   copying more difficult.
*/


document.addEventListener(
    "contextmenu",
    e => e.preventDefault()
);


document.addEventListener(
    "copy",
    e => e.preventDefault()
);


document.addEventListener(
    "cut",
    e => e.preventDefault()
);


document.addEventListener(
    "dragstart",
    e => e.preventDefault()
);


document.addEventListener(
    "selectstart",
    e => e.preventDefault()
);


/* Keyboard protection */

document.addEventListener(
    "keydown",
    function(e) {

        const key =
            e.key.toLowerCase();


        /* Copy */

        if(e.ctrlKey && key === "c")
            e.preventDefault();


        /* Cut */

        if(e.ctrlKey && key === "x")
            e.preventDefault();


        /* Save */

        if(e.ctrlKey && key === "s")
            e.preventDefault();


        /* View source */

        if(e.ctrlKey && key === "u")
            e.preventDefault();


        /* Print */

        if(e.ctrlKey && key === "p")
            e.preventDefault();


        /* Developer tools */

        if(
            e.key === "F12" ||
            (e.ctrlKey &&
             e.shiftKey &&
             ["i","j","c"].includes(key))
        ) {

            e.preventDefault();

        }

    }
);


/* =====================================================
   HIDE QUESTION WHEN TAB IS LEFT
===================================================== */

document.addEventListener(
    "visibilitychange",
    function() {

        const question =
            document.getElementById("question");

        const options =
            document.getElementById("options");


        if(document.hidden) {

            question.textContent =
                "⚠ QUESTION HIDDEN";

            question.style.filter =
                "blur(15px)";

            options.style.filter =
                "blur(15px)";

        } else {

            question.style.filter =
                "none";

            options.style.filter =
                "none";


            if(
                questions.length &&
                currentQuestion < questions.length
            ) {

                question.textContent =
                    questions[currentQuestion].q;

            }

        }

    }
);


/* =====================================================
   PREVENT PRINTING
===================================================== */

window.addEventListener(
    "beforeprint",
    function() {

        document.body.innerHTML =
            "<h1 style='text-align:center'>Printing is disabled.</h1>";

    }
);

</script>
